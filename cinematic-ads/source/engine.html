<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--ink:#151822;--muted:#5b6475;--red:#C8161E;--orange:#EA580C;--green:#1E9E62;--line:#E6E8EF;--soft:#F6F7FB}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#000;font-family:Poppins,sans-serif;color:var(--ink)}
#stage{position:relative;overflow:hidden;background:#fff}
.layer{position:absolute;left:0;top:0;overflow:visible}
#scene,#ui,#fx{position:absolute;inset:0}
#ui{pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.38) 100%)}
#grain{opacity:.07;mix-blend-mode:overlay}
#lb{pointer-events:none}
#lb i{position:absolute;left:0;right:0;background:#07080B}
#subs{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
#subs span{display:inline-block;max-width:84%;text-align:center;color:#fff;font-weight:500;line-height:1.3;padding:.18em .6em;border-radius:.35em;background:rgba(10,12,18,.62)}
#ttl{position:absolute;color:#fff;font-weight:400;letter-spacing:.06em;text-shadow:0 2px 10px rgba(0,0,0,.45);background:rgba(10,12,18,.58);padding:.5em .8em .6em;border-radius:.35em}
#ttl:empty{display:none}
#ttl b{display:block;width:56px;height:4px;background:var(--red);margin-bottom:10px}
#bug{position:absolute;display:flex;align-items:center;gap:10px;color:#fff;font-weight:500;opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#bug img{border-radius:50%;background:#fff}
#disc{position:absolute;color:rgba(255,255,255,.78);font-weight:400;letter-spacing:.04em}
#trans{background:#000;opacity:0}
/* screen shots */
.scr{position:absolute;inset:0;background:radial-gradient(1200px 700px at 85% 0%,rgba(200,22,30,.06),rgba(200,22,30,0) 60%),radial-gradient(1000px 800px at 0% 100%,rgba(37,72,170,.06),rgba(37,72,170,0) 60%),#fff}
.scr .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(21,24,34,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(21,24,34,.035) 1px,transparent 1px);background-size:64px 64px}
.scr .head{position:absolute}
.scr .head h1{font-weight:600;letter-spacing:-.5px;line-height:1.12;text-wrap:balance}
.scr .head p,.big,.mut{text-wrap:balance}
.scr .head p{color:var(--muted);font-weight:400;line-height:1.3;margin-top:.35em}
.frame{position:absolute;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(21,24,34,.18),0 0 0 1px var(--line)}
.chrome{height:52px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;padding:0 20px}
.chrome i{width:14px;height:14px;border-radius:50%;background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
.chrome .url{margin-left:16px;flex:1;height:32px;border-radius:16px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:19px;display:flex;align-items:center;padding:0 18px}
.view{position:relative;overflow:hidden;background:#eef1f6}
.vlayer{position:absolute;left:0;top:0;width:1366px;height:768px;transform-origin:0 0}
.vlayer img{width:1366px;height:768px;display:block}
.note{position:absolute;transform:translate(-50%,-50%);background:#fff;color:var(--ink);font-weight:500;line-height:1.2;padding:12px 22px 12px 32px;border-radius:14px;border:3px solid var(--red);box-shadow:0 12px 30px rgba(21,24,34,.18);white-space:nowrap;overflow:hidden}
.note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:11px;background:var(--red)}
/* cards */
.card{position:absolute;inset:0;background:radial-gradient(1100px 800px at 90% 0%,rgba(200,22,30,.07),rgba(200,22,30,0) 60%),radial-gradient(1000px 900px at 0% 100%,rgba(37,72,170,.06),rgba(37,72,170,0) 60%),#fff;display:flex;flex-direction:column;justify-content:center}
.card .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(21,24,34,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(21,24,34,.035) 1px,transparent 1px);background-size:64px 64px}
.pad{position:relative;padding:0 8%}
.kick{color:var(--red);font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.big{font-weight:600;letter-spacing:-.02em;line-height:1.08}
.mut{color:var(--muted);font-weight:400}
.rule{height:5px;width:120px;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--orange))}
.pill{display:inline-flex;align-items:center;gap:.5em;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.35em 1em;box-shadow:0 6px 18px rgba(21,24,34,.06)}
.ck{flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),var(--orange))}
.ck.g{background:var(--green)}.ck.x{background:#9AA3AF}
.item{display:flex;align-items:center;gap:.7em;background:#fff;border:1px solid var(--line);border-radius:.6em;box-shadow:0 8px 24px rgba(21,24,34,.06);font-weight:500}
.phone{position:absolute;background:#111827;border-radius:56px;padding:18px;box-shadow:0 40px 80px rgba(21,24,34,.28)}
.phone .scrn{width:100%;height:100%;border-radius:40px;overflow:hidden;background:#EFE9E1;display:flex;flex-direction:column}
.phone .bar{background:#0F6E5C;color:#fff;display:flex;align-items:center;gap:14px;padding:22px 22px 18px}
.phone .bar .av{border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.msgs{flex:1;padding:22px 18px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end}
.bub{max-width:82%;padding:14px 18px;border-radius:18px;line-height:1.3;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.bub.shop{align-self:flex-start;background:#fff;border-top-left-radius:4px}
.bub.me{align-self:flex-end;background:#DCF7C5;border-top-right-radius:4px}
.pdf{display:flex;align-items:center;gap:12px;background:#F3F4F6;border-radius:12px;padding:12px;margin-bottom:8px}
.pdf i{width:46px;height:56px;border-radius:6px;background:#E5484D;color:#fff;font-style:normal;font-weight:600;display:grid;place-items:center;font-size:15px}
.opt{display:flex;align-items:center;gap:.7em;border:2px solid var(--line);background:#fff;border-radius:.6em;font-weight:500}
.opt b{display:grid;place-items:center;border-radius:50%;background:var(--soft);font-weight:600}
.lower3{position:absolute;display:flex;flex-direction:column}
.lower3 .tag{align-self:flex-start;background:var(--red);color:#fff;font-weight:600;letter-spacing:.12em;padding:.25em .8em}
.lower3 .hl{background:#fff;color:var(--ink);font-weight:600;padding:.35em .8em;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ticker{position:absolute;left:0;right:0;bottom:0;background:#151822;color:#fff;white-space:nowrap;overflow:hidden;font-weight:400}
.ticker span{display:inline-block;padding-left:100%}
.end{position:absolute;inset:0;background:radial-gradient(900px 700px at 90% 0%,rgba(200,22,30,.08),rgba(200,22,30,0) 65%),radial-gradient(900px 800px at 0% 100%,rgba(37,72,170,.07),rgba(37,72,170,0) 60%),#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.end .logo{border-radius:50%;background:#fff;box-shadow:0 0 0 12px rgba(200,22,30,.06),0 20px 60px rgba(200,22,30,.22)}
.end .btn{color:#fff;font-weight:600;border-radius:.6em;background:linear-gradient(135deg,#F97316,var(--orange));box-shadow:0 22px 50px rgba(234,88,12,.28)}
.flag{display:inline-flex;flex-direction:column;border-radius:5px;overflow:hidden;border:1px solid var(--line);vertical-align:middle}
.flag i{flex:1}.flag i:nth-child(1){background:#FF9933}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#138808}
</style></head>
<body>
<div id="stage">
  <div id="scene"></div>
  <div id="ui"></div>
  <div class="ov" id="grade"></div>
  <div class="ov" id="vig"></div>
  <canvas class="ov" id="grain"></canvas>
  <div class="ov" id="lb"><i id="lbt"></i><i id="lbb"></i></div>
  <div id="bug"><img src="logo.png" alt=""><span>Nexcod POS</span></div>
  <div id="disc">Dramatization · Kalpanik drishya</div>
  <div id="ttl"></div>
  <div id="subs"><span></span></div>
  <div class="ov" id="trans"></div>
</div>
<script src="characters.js"></script>
<script src="engine.js"></script>
</body></html>
