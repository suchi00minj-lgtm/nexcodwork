<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--navy:#0a1838;--navy2:#13286a;--red:#ef2b34;--orange:#f97316;--ink:#ffffff;--muted:#b8c4ea;--card:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:Poppins,sans-serif;color:var(--ink)}
#bg{position:absolute;inset:0;background:radial-gradient(1200px 900px at 85% 8%,#1d3a8f 0%,rgba(29,58,143,0) 60%),radial-gradient(900px 900px at 5% 95%,#5a0f2a 0%,rgba(90,15,42,0) 60%),linear-gradient(170deg,var(--navy) 0%,var(--navy2) 100%)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:72px 72px}
#glow{position:absolute;width:700px;height:700px;border-radius:50%;left:-120px;top:520px;background:radial-gradient(circle,rgba(239,43,52,.35),rgba(239,43,52,0) 65%)}
#brand{position:absolute;left:60px;top:70px;display:flex;align-items:center;gap:18px;padding:12px 26px 12px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
#brand img{width:64px;height:64px;border-radius:50%;background:#fff}
#brand b{font-size:34px;font-weight:700;letter-spacing:.2px}#brand b span{color:var(--red)}
#tag{position:absolute;right:60px;top:88px;font-size:24px;font-weight:600;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
#prog{position:absolute;left:60px;right:60px;top:40px;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
#prog i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--orange));transform-origin:left center}
#foot{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:32px;color:var(--muted);font-weight:500}
#foot b{color:#fff}
#scene{position:absolute;inset:0}
.center{position:absolute;left:70px;right:70px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
/* hook */
.hook .line{font-size:104px;line-height:1.12;font-weight:800;letter-spacing:-1px}
.hook .line.acc{color:var(--orange)}
.hook .bar{height:14px;width:300px;border-radius:10px;background:linear-gradient(90deg,var(--red),var(--orange));margin-top:44px;transform-origin:left}
/* shot */
.head{position:absolute;left:70px;right:70px;top:250px}
.head h1{font-size:82px;line-height:1.1;font-weight:800;letter-spacing:-1px}
.head p{font-size:44px;line-height:1.3;color:var(--muted);margin-top:18px;font-weight:500}
.frame{position:absolute;left:40px;width:1000px;top:600px;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.15)}
.chrome{height:58px;background:#eef1f7;display:flex;align-items:center;gap:12px;padding:0 22px}
.chrome i{width:16px;height:16px;border-radius:50%;background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
.chrome .url{margin-left:18px;flex:1;height:36px;border-radius:18px;background:#fff;color:#4b5563;font-size:22px;display:flex;align-items:center;padding:0 20px;font-weight:500}
.view{position:relative;width:1000px;height:820px;overflow:hidden;background:#e9edf5}
.layer{position:absolute;left:0;top:0;width:1366px;height:768px;transform-origin:0 0}
.layer img{width:1366px;height:768px;display:block}
.hl{position:absolute;border:6px solid var(--orange);border-radius:14px;box-shadow:0 0 0 9999px rgba(10,24,56,.28)}
/* bullets */
.bul h2{font-size:84px;line-height:1.12;font-weight:800;letter-spacing:-1px;margin-bottom:60px}
.bul .it{display:flex;align-items:center;gap:30px;font-size:56px;font-weight:600;line-height:1.2;padding:26px 30px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);margin-bottom:26px}
.bul .ck{flex:none;width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--orange));display:grid;place-items:center}
.bul .ck svg{width:42px;height:42px}
/* stat */
.stat{align-items:center;text-align:center}
.stat .small{font-size:32px;letter-spacing:6px;font-weight:600;color:var(--orange);margin-bottom:34px}
.stat .big{font-size:132px;line-height:1.05;font-weight:800;letter-spacing:-2px}
.stat .label{font-size:52px;line-height:1.3;color:var(--muted);margin-top:40px;font-weight:500;max-width:900px}
.stat .ring{width:220px;height:14px;border-radius:10px;background:linear-gradient(90deg,var(--red),var(--orange));margin:46px auto 0}
/* price */
.price{align-items:center;text-align:center}
.pill{display:inline-block;font-size:34px;font-weight:700;letter-spacing:4px;padding:14px 34px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.strike{font-size:70px;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red);margin-top:60px;font-weight:600}
.amt{font-size:250px;line-height:1;font-weight:800;letter-spacing:-6px;margin-top:10px}
.amt small{font-size:70px;letter-spacing:0;font-weight:600;color:var(--muted)}
.permo{font-size:54px;margin-top:40px;font-weight:600}
.permo b{color:var(--orange)}
.off{position:absolute;right:110px;top:560px;width:230px;height:230px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--orange));display:grid;place-items:center;text-align:center;font-size:52px;font-weight:800;line-height:1;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.off span{display:block;font-size:30px;font-weight:600;margin-top:6px}
/* cta */
.cta{align-items:center;text-align:center}
.cta .logo{width:250px;height:250px;border-radius:50%;background:#fff;box-shadow:0 0 0 14px rgba(255,255,255,.1),0 0 120px rgba(239,43,52,.6)}
.cta .word{font-size:104px;font-weight:800;margin-top:50px;letter-spacing:-1px}.cta .word span{color:var(--red)}
.cta .what{font-size:44px;color:var(--muted);font-weight:500;margin-top:6px}
.cta .btn{margin-top:70px;font-size:62px;font-weight:800;padding:34px 70px;border-radius:30px;background:linear-gradient(135deg,#ff8a1f,var(--orange) 50%,#ea580c);box-shadow:0 24px 60px rgba(249,115,22,.45)}
.cta .btn small{display:block;font-size:34px;font-weight:600;margin-top:6px;opacity:.95}
.cta .site{font-size:84px;font-weight:800;margin-top:66px;letter-spacing:-.5px}
.cta .ph{font-size:38px;color:var(--muted);margin-top:22px;font-weight:500}
.cta .ph b{color:#fff}
.cta .india{display:flex;align-items:center;gap:18px;margin-top:46px;font-size:34px;font-weight:600}
.cta .flag{width:66px;height:44px;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.cta .flag i{flex:1}.cta .flag i:nth-child(1){background:#ff9933}.cta .flag i:nth-child(2){background:#fff}.cta .flag i:nth-child(3){background:#138808}
</style></head>
<body>
<div id="bg"></div><div id="grid"></div><div id="glow"></div>
<div id="prog"><i></i></div>
<div id="brand"><img src="logo.png" alt=""><b>Nexcod <span>POS</span></b></div>
<div id="tag">Pharmacy Billing</div>
<div id="scene"></div>
<div id="foot"><b>nexcodpos.in</b> · 7 din free trial</div>
<script>
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
const ease='cubic-bezier(.2,.8,.2,1)';
function inA(el,delay,dur,from){return el.animate([{opacity:0,transform:from||'translateY(60px)'},{opacity:1,transform:'none'}],{delay:delay*1000,duration:(dur||.6)*1000,fill:'both',easing:ease})}
function fit(r,W,H){ // rect -> transform for layer inside W x H view
  let s=Math.min(W/r[2],H/r[3]); s=Math.max(Math.max(W/1366,H/768),Math.min(s,2.3));
  let tx=W/2-s*(r[0]+r[2]/2), ty=H/2-s*(r[1]+r[3]/2);
  const iw=1366*s, ih=768*s;
  tx = iw>=W ? Math.min(0,Math.max(W-iw,tx)) : (W-iw)/2;
  ty = ih>=H ? Math.min(0,Math.max(H-ih,ty)) : (H-ih)/2;
  return `translate(${tx}px,${ty}px) scale(${s})`;
}
window.build=async function(sc,meta){
  document.getAnimations().forEach(a=>a.cancel());
  const root=document.getElementById('scene');root.innerHTML='';
  const D=sc.dur, V=sc.vodur||D;
  // progress bar over the whole video
  document.querySelector('#prog i').animate([{transform:`scaleX(${meta.start/meta.total})`},{transform:`scaleX(${(meta.start+D)/meta.total})`}],{duration:D*1000,fill:'both'});
  document.getElementById('glow').animate([{transform:'translate(0,0)'},{transform:'translate(80px,-60px)'}],{duration:D*1000,fill:'both',direction:'alternate'});
  let box;
  if(sc.type==='hook'){
    box=E('div','center hook');
    sc.lines.forEach((l,i)=>{const d=E('div','line'+(i===sc.lines.length-1?' acc':''),l);box.appendChild(d);inA(d,.15+i*Math.min(.9,(V*.75)/sc.lines.length),.6)});
    const bar=E('div','bar');box.appendChild(bar);
    bar.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{delay:(.3+(sc.lines.length-1)*Math.min(.9,(V*.75)/sc.lines.length)+.4)*1000,duration:600,fill:'both',easing:ease});
  }
  if(sc.type==='shot'){
    box=E('div','');
    const hd=E('div','head');hd.appendChild(E('h1','',sc.head));hd.appendChild(E('p','',sc.sub));box.appendChild(hd);
    inA(hd.children[0],.05,.55);inA(hd.children[1],.25,.55);
    const fr=E('div','frame');const ch=E('div','chrome','<i></i><i></i><i></i>');ch.appendChild(E('div','url',sc.url||'nexcodpos.in'));fr.appendChild(ch);
    const vw=E('div','view');const ly=E('div','layer');const im=E('img');im.src='shots/'+sc.img+'.png';ly.appendChild(im);vw.appendChild(ly);fr.appendChild(vw);box.appendChild(fr);
    inA(fr,.15,.7,'translateY(120px) scale(.94)');
    const W=1000,H=820;
    const z=sc.zoom.length?sc.zoom:[[0,0,1366,768]];
    const z0=z[0], cx=z0[0]+z0[2]/2, cy=z0[1]+z0[3]/2, ew=Math.min(1366,z0[2]*1.5), eh=Math.min(768,z0[3]*1.5);
    const full=[Math.max(0,Math.min(1366-ew,cx-ew/2)),Math.max(0,Math.min(768-eh,cy-eh/2)),ew,eh];
    const kf=[{transform:fit(full,W,H),offset:0},{transform:fit(full,W,H),offset:Math.min(.9,.5/D)}];
    if(z.length===1){kf.push({transform:fit(z[0],W,H),offset:Math.min(.95,2.1/D)});kf.push({transform:fit(z[0],W,H),offset:1});}
    else{kf.push({transform:fit(z[0],W,H),offset:Math.min(.45,2.0/D)});kf.push({transform:fit(z[0],W,H),offset:.55});kf.push({transform:fit(z[1],W,H),offset:Math.min(.9,.55+1.5/D)});kf.push({transform:fit(z[1],W,H),offset:1});}
    ly.animate(kf,{duration:D*1000,fill:'both',easing:'cubic-bezier(.45,0,.25,1)'});
    if(sc.hl){const h=E('div','hl');Object.assign(h.style,{left:sc.hl[0]+'px',top:sc.hl[1]+'px',width:sc.hl[2]+'px',height:sc.hl[3]+'px'});ly.appendChild(h);
      h.animate([{opacity:0},{opacity:1}],{delay:2200,duration:400,fill:'both'});
      h.animate([{borderColor:'#f97316'},{borderColor:'#ffd166'},{borderColor:'#f97316'}],{delay:2600,duration:900,iterations:20,fill:'both'});}
  }
  if(sc.type==='bullets'){
    box=E('div','center bul');const h=E('h2','',sc.title);box.appendChild(h);inA(h,.05,.55);
    const step=Math.max(.35,Math.min(.9,(V-.8)/sc.items.length));
    sc.items.forEach((t,i)=>{const it=E('div','it');it.appendChild(E('div','ck',CHECK));it.appendChild(E('div','',t));box.appendChild(it);inA(it,.45+i*step,.5,'translateX(-90px)')});
  }
  if(sc.type==='stat'){
    box=E('div','center stat');
    if(sc.small){const s=E('div','small',sc.small);box.appendChild(s);inA(s,.05,.5)}
    const b=E('div','big',sc.big);box.appendChild(b);b.animate([{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'scale(1.04)',offset:.7},{opacity:1,transform:'scale(1)'}],{delay:250,duration:700,fill:'both'});
    const l=E('div','label',sc.label);box.appendChild(l);inA(l,.9,.6);
    const r=E('div','ring');box.appendChild(r);r.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{delay:1300,duration:600,fill:'both',easing:ease});
  }
  if(sc.type==='price'){
    box=E('div','center price');
    const p=E('div','pill','PLATINUM · 1 SAAL');box.appendChild(p);inA(p,.05,.5);
    const s=E('div','strike','₹4,999');box.appendChild(s);inA(s,.35,.5);
    const a=E('div','amt','₹1,299<small> /saal</small>');box.appendChild(a);a.animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1.05)',offset:.7},{opacity:1,transform:'scale(1)'}],{delay:700,duration:800,fill:'both'});
    const m=E('div','permo','Sirf <b>₹108</b> mahina');box.appendChild(m);inA(m,Math.min(V*.55,3.2),.6);
    const o=E('div','off','74%<span>OFF</span>');root.appendChild(o);o.animate([{opacity:0,transform:'rotate(-30deg) scale(.3)'},{opacity:1,transform:'rotate(10deg) scale(1)'}],{delay:1500,duration:600,fill:'both',easing:ease});
  }
  if(sc.type==='cta'){
    box=E('div','center cta');
    const lg=E('img','logo');lg.src='logo.png';box.appendChild(lg);lg.animate([{opacity:0,transform:'scale(.4) rotate(-40deg)'},{opacity:1,transform:'scale(1) rotate(0)'}],{delay:50,duration:800,fill:'both',easing:ease});
    const w=E('div','word','Nexcod <span>POS</span>');box.appendChild(w);inA(w,.45,.55);
    const wt=E('div','what','Pharmacy Billing Software');box.appendChild(wt);inA(wt,.65,.55);
    const b=E('div','btn','7 DIN FREE TRIAL<small>Koi card nahi chahiye</small>');box.appendChild(b);inA(b,1.0,.6,'translateY(60px) scale(.9)');
    b.animate([{transform:'scale(1)'},{transform:'scale(1.045)'},{transform:'scale(1)'}],{delay:1800,duration:1100,iterations:10,fill:'none'});
    const st=E('div','site','nexcodpos.in');box.appendChild(st);inA(st,1.4,.6);
    const ph=E('div','ph','Call <b>73198 33790</b> · WhatsApp <b>72819 21783</b>');box.appendChild(ph);inA(ph,1.7,.6);
    const ind=E('div','india','<div class="flag"><i></i><i></i><i></i></div>Made in India, for Indian pharmacies');box.appendChild(ind);inA(ind,2.0,.6);
    document.getElementById('foot').style.display='none';
  } else document.getElementById('foot').style.display='';
  root.appendChild(box);
  if(!meta.last){root.animate([{opacity:1},{opacity:1,offset:.0001},{opacity:0}],{delay:(D-.25)*1000,duration:250,fill:'forwards'});}
  await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  document.getAnimations().forEach(a=>a.pause());
  return true;
};
window.seek=function(t){document.getAnimations().forEach(a=>{a.currentTime=t*1000});};
</script>
</body></html>
